<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mystery+Quest&display=swap" rel="stylesheet">

</head>
<body>

    <header id="inicio">
        <h1> ✞ Hotel Santo Berço. ✞ </h1>
        <p> Desde 19## cuidando do seu descanso. </p>
    </header>

    <hr>

    <nav>
        <a href="#inicio"> Inicio. </a>

        <a href="#reserva"> Faça sua reserva. </a>

        <a href="#fotos"> Fotos. </a>

        <a href="#contatos"> Contatos. </a>
    </nav>

    <hr>
    
    <main>

        <section id="reserva">
            <h2> Faça sua Reserva. </h2>

            <p> Preencha os dados abaixo para reservar sua estadia no nosso hotel. </p>

            <h3> Dados do Hóspede: </h3>

            <label for="entrada"> Data de entrada: </label>
            <input type="text" id="nome" name="nome">

            <label for="email"> E-mail: </label>
            <input type="text" id="email" name="email">

            <label for="telefone"> Telefone: </label>
            <input type="tel" id="telefone" name="telefone">

            <h3> Sua estadia. </h3>

            <label for="entrada"> Data de entrada: </label>
            <input type="date" id="entrada" name="entrada">

            <label for="saida"> Data de saida: </label>
            <input type="date" id="saida" name="saida">

            <label for="hospedes"> Número de hóspedes: </label>
            <select name="quarto" id="hospedes">
                <option value="1"> 1 hóspede. </option>
                <option value="2"> 2 hóspedes. </option>
                <option value="3"> 3 hóspedes. </option>
                <option value="4"> 4 hóspedes. </option>
            </select>

            <h3> Escolha seu quarto: </h3>

            <label for="quarto"> Tipo de quarto: </label>

            <select name="quarto" id="quarto">
                <option value="standard"> Quarto Standard.</option>
                <option value="deluxe"> Quarto Deluxe.</option>
                <option value="suite"> Suíte Santo Berço.</option>
                <option value="213"> Especial 213.</option>
                <option value="215"> Especial 215.</option>
            </select>

            <br>
            <br>

            <button type="button"> Confirmar estadia. </button>

        </section>

        <section id="fotos">
            <h2> Conheça nosso Hotel. </h2>


        </section>

    </main>

    <footer id="contatos">
        <h2> Contatos: </h2>

    </footer>
</body>
</html>
